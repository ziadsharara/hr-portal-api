name: CD

# Deploys on every merge to main (small team, trunk-based) plus a manual
# trigger for re-running a deploy without a new commit — needed for the
# first-ever deploy after `terraform apply`, since the instance boots
# before any image exists in ECR. See DEPLOYMENT.md.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  id-token: write # required for GitHub OIDC -> AWS role assumption
  contents: read

# Two deploys racing to run deploy.sh on the same instance would have
# them fighting over the same .env file and Compose project. Queue them
# instead, and let a newer commit supersede one that has not started.
concurrency:
  group: cd-backend
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPO: hr-portal-api
  INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}

jobs:
  build-and-push:
    name: Build & push image
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.tag.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: tag
        run: echo "value=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      # No long-lived AWS access keys stored as secrets: this exchanges
      # the workflow's short-lived GitHub OIDC token for temporary AWS
      # credentials via the IAM role in infra/iam_github_oidc.tf, which
      # trusts only this exact repo and branch.
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # Both tags point at the same image. The SHA tag is what this
      # deploy pins; :latest exists only so a freshly booted instance has
      # something to pull before it knows any SHA.
      - name: Build & push image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          docker build -t "$REGISTRY/$ECR_REPO:$TAG" -t "$REGISTRY/$ECR_REPO:latest" .
          docker push "$REGISTRY/$ECR_REPO:$TAG"
          docker push "$REGISTRY/$ECR_REPO:latest"

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # The deploy runs over SSM Run Command rather than SSH. There is no
      # key for this repo to hold, no inbound path from CI to the
      # instance, and port 22 can stay shut entirely. The script being
      # invoked was placed on the box by Terraform's user data.
      - name: Trigger redeploy via SSM
        id: send
        env:
          TAG: ${{ needs.build-and-push.outputs.image-tag }}
        run: |
          set -euo pipefail

          if [ -z "${INSTANCE_ID:-}" ]; then
            echo "EC2_INSTANCE_ID repository variable is not set." >&2
            echo "Set it to Terraform's backend_instance_id output." >&2
            exit 1
          fi

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy $TAG from ${GITHUB_REF_NAME}" \
            --parameters "commands=[\"/opt/hr-portal/deploy.sh $TAG\"]" \
            --query Command.CommandId --output text)

          echo "command-id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "Dispatched SSM command $COMMAND_ID"

      # `aws ssm wait command-executed` is not used here: its built-in
      # waiter gives up after ~100 seconds, which a cold image pull can
      # easily exceed, and it errors out if the invocation record has not
      # yet propagated. This polls explicitly instead.
      - name: Wait for deploy to finish
        env:
          COMMAND_ID: ${{ steps.send.outputs.command-id }}
        run: |
          set -euo pipefail

          DEADLINE=$(( $(date +%s) + 900 ))
          STATUS="Pending"

          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            # Tolerate a not-yet-propagated invocation on the first polls.
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo "Pending")

            case "$STATUS" in
              Pending|InProgress|Delayed) sleep 10 ;;
              *) break ;;
            esac
          done

          echo "--- deploy stdout ---"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text || true

          echo "--- deploy stderr ---"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query StandardErrorContent --output text || true

          if [ "$STATUS" != "Success" ]; then
            echo "Deploy finished with status: $STATUS" >&2
            exit 1
          fi

          echo "Deploy succeeded."

      # deploy.sh returning 0 only means Compose accepted the new image,
      # not that the application came up: Spring Boot can still fail on a
      # bad migration or an unreachable database seconds later. Without
      # this check a broken release reports green.
      - name: Verify the API is healthy
        env:
          COMMAND_ID: ${{ steps.send.outputs.command-id }}
        run: |
          set -euo pipefail

          # Probed through `compose exec` against the container's own port
          # rather than curling the host's published port, so this stays
          # correct if backend_port is ever remapped, and does not depend
          # on the generated container name.
          HEALTH_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Post-deploy health check" \
            --parameters 'commands=["cd /opt/hr-portal; for i in $(seq 1 30); do docker compose exec -T backend wget -q -O- http://127.0.0.1:8080/api/actuator/health | grep -q UP && echo HEALTHY && exit 0; sleep 5; done; echo UNHEALTHY; docker compose logs --tail 50 backend; exit 1"]' \
            --query Command.CommandId --output text)

          DEADLINE=$(( $(date +%s) + 300 ))
          STATUS="Pending"

          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$HEALTH_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo "Pending")

            case "$STATUS" in
              Pending|InProgress|Delayed) sleep 10 ;;
              *) break ;;
            esac
          done

          aws ssm get-command-invocation \
            --command-id "$HEALTH_ID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text || true

          if [ "$STATUS" != "Success" ]; then
            echo "API did not become healthy after deploy (status: $STATUS)." >&2
            exit 1
          fi
