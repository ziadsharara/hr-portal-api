
# All values below MUST come from the environment — no hardcoded host,
# credentials, or "change-me" placeholders committed here. There are no
# defaults on purpose: if a required var is missing, startup fails fast
# instead of silently connecting to the wrong database.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
