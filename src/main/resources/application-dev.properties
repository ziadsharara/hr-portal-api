# Local-machine-only profile for running the app directly via
# `mvn spring-boot:run` (outside Docker). Values are overridable via env
# vars specifically so no real local credential has to be hardcoded here
# — set DEV_DB_USERNAME/DEV_DB_PASSWORD to match your local MySQL if the
# defaults below don't.
spring.datasource.url=jdbc:mysql://localhost:3306/hr_portal_dev?useSSL=false&serverTimezone=UTC
spring.datasource.username=${DEV_DB_USERNAME:root}
spring.datasource.password=${DEV_DB_PASSWORD:root}