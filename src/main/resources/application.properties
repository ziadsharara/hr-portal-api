spring.application.name=hr-portal-api
spring.profiles.active=dev

# Same in every environment — this is a routing contract (ALB path rule
# /api/* and the frontend's nginx proxy both assume it), not something
# that should vary per profile. It used to live only in
# application-dev.properties, which meant the prod profile silently
# served routes at the root instead of /api.
server.servlet.context-path=/api

# Schema is owned by 01_create_schema.sql / 02_create_dev_schema.sql,
# NOT by Hibernate — never let JPA touch DDL against real HR data.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Container/orchestrator health checks (Docker HEALTHCHECK, ECS task health
# check, ALB target group health check) hit GET /actuator/health. Only the
# health endpoint is exposed and without details — the API has no
# authentication yet, so we don't want to leak dependency/config info
# (e.g. DB connectivity details) to anyone who can reach this port.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
